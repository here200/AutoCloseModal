<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹窗动态DOM测试页（点击创建 / 确认销毁）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 30px;
    color: #333;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
  }
  h1 { font-size: 22px; margin-bottom: 6px; color: #4a2f8f; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 20px; line-height: 1.6; }
  .mode-switch {
    display: flex; gap: 10px; margin-bottom: 20px;
    background: #f3f0fa; padding: 10px; border-radius: 10px;
  }
  .mode-switch button {
    flex: 1; padding: 10px; border: 2px solid transparent;
    background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px;
    transition: all .2s;
  }
  .mode-switch button.active {
    border-color: #764ba2; background: #4a2f8f; color: #fff; font-weight: bold;
  }
  .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  button {
    padding: 12px 22px; border: none; border-radius: 8px;
    cursor: pointer; font-size: 14px; transition: all .15s;
  }
  .btn-open { background: #4a2f8f; color: #fff; font-weight: bold; }
  .btn-open:hover { background: #3a2370; }
  .btn-clear { background: #eee; color: #555; }
  .status {
    display: flex; gap: 20px; margin-bottom: 20px;
    font-size: 13px; color: #666;
  }
  .status b { color: #4a2f8f; font-size: 16px; }
  /* 弹窗遮罩 */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center; z-index: 999;
    animation: fadeIn .2s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #fff; border-radius: 14px; width: 400px; max-width: 90vw;
    padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,.3);
    animation: popIn .25s;
  }
  @keyframes popIn { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h2 { font-size: 17px; margin-bottom: 6px; }
  .modal .tip { font-size: 12px; color: #e00; margin-bottom: 14px; }
  .checkbox-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .checkbox-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid #e0e0e0; border-radius: 8px; cursor: pointer; transition: all .15s;
  }
  .checkbox-item:hover { border-color: #764ba2; background: #faf8ff; }
  .checkbox-item input { width: 18px; height: 18px; cursor: pointer; }
  .modal-actions { display: flex; gap: 10px; }
  .btn-cancel { flex: 1; background: #eee; color: #555; }
  .btn-confirm { flex: 2; background: #4a2f8f; color: #fff; font-weight: bold; }
  .btn-confirm:disabled { background: #ccc; cursor: not-allowed; }
  /* 日志 */
  .log-panel { margin-top: 10px; }
  .log-panel h3 { font-size: 14px; color: #4a2f8f; margin-bottom: 8px; }
  #log {
    background: #1e1e2e; color: #a6e3a1; font-family: Consolas, monospace;
    font-size: 12px; padding: 14px; border-radius: 10px; height: 240px;
    overflow-y: auto; white-space: pre-wrap; line-height: 1.7;
  }
  #log .warn { color: #f9e2af; }
  #log .err { color: #f38ba8; }
  #log .info { color: #89dceb; }
  .dom-hint { font-size: 12px; color: #888; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>弹窗动态 DOM 测试页</h1>
  <p class="subtitle">
    模拟真实场景：<b>弹窗 DOM 在点击「打开」后才动态创建</b>，<b>确认/取消后整个弹窗 DOM 被完全销毁（remove）</b>。
    可切换「手动模式」与「自动模式」对比效果。
  </p>

  <div class="mode-switch">
    <button id="modeManual" class="active">✋ 手动模式（对照）</button>
    <button id="modeAuto">🤖 自动模式（自动全选+确认）</button>
  </div>

  <div class="toolbar">
    <button class="btn-open" id="openBtn">打开弹窗</button>
    <button class="btn-clear" id="clearLog">清空日志</button>
  </div>

  <div class="status">
    <span>弹窗DOM存在：<b id="domExist">否</b></span>
    <span>已勾选：<b id="checkedCount">0</b> / 5</span>
  </div>

  <div class="dom-hint">
    💡 打开浏览器控制台（F12），在 <b>Elements</b> 面板查看弹窗DOM的<b>创建与销毁</b>过程。
  </div>

  <div class="log-panel">
    <h3>📋 运行日志</h3>
    <div id="log"></div>
  </div>
</div>

<script>
// ===== 日志工具 =====
const logEl = document.getElementById('log');
function log(msg, type) {
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  const line = document.createElement('div');
  if (type) line.className = type;
  line.textContent = `[${time}] ${msg}`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  console.log(`%c[${time}] ${msg}`, 'color:#764ba2;font-weight:bold');
}

// ===== 模式切换 =====
let autoMode = false;
const modeManual = document.getElementById('modeManual');
const modeAuto = document.getElementById('modeAuto');
modeManual.onclick = () => { autoMode = false; modeManual.classList.add('active'); modeAuto.classList.remove('active'); log('切换为【手动模式】', 'warn'); };
modeAuto.onclick = () => { autoMode = true; modeAuto.classList.add('active'); modeManual.classList.remove('active'); log('切换为【自动模式】', 'info'); };

// ===== 状态显示 =====
const domExistEl = document.getElementById('domExist');
const checkedCountEl = document.getElementById('checkedCount');
function refreshStatus() {
  const modal = document.querySelector('.modal-overlay');
  domExistEl.textContent = modal ? '是' : '否';
  const checked = modal ? modal.querySelectorAll('input[type="checkbox"]:checked').length : 0;
  checkedCountEl.textContent = checked;
}
setInterval(refreshStatus, 200);

// ===== 核心：动态创建弹窗 DOM =====
function createModalDOM() {
  log('▶ 开始动态创建弹窗 DOM...');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <h2>请选择所有项</h2>
    <p class="tip">⚠️ 需选择全部选项后才能确认</p>
    <div class="checkbox-list"></div>
    <div class="modal-actions">
      <button class="btn-cancel">取消</button>
      <button class="btn-confirm" disabled>确定</button>
    </div>
  `;

  const list = modal.querySelector('.checkbox-list');
  const options = ['选项 A', '选项 B', '选项 C', '选项 D', '选项 E'];
  options.forEach(name => {
    const label = document.createElement('label');
    label.className = 'checkbox-item';
    label.innerHTML = `<input type="checkbox"> <span>${name}</span>`;
    list.appendChild(label);
  });

  overlay.appendChild(modal);
  document.body.appendChild(overlay); // ← 点击后才创建并挂载
  log(`✅ 弹窗 DOM 已挂载到 <body>（共 ${options.length} 个复选框）`, 'info');

  bindModalEvents(overlay, modal);
  return { overlay, modal };
}

// ===== 核心：销毁弹窗 DOM =====
function destroyModalDOM(overlay, reason) {
  if (!overlay || !overlay.parentNode) return;
  overlay.remove(); // ← 完全销毁整个弹窗 DOM
  log(`🗑️ 弹窗 DOM 已完全销毁（remove）—— 原因：${reason}`, 'warn');
}

// ===== 弹窗内事件绑定 =====
function bindModalEvents(overlay, modal) {
  const checkboxes = modal.querySelectorAll('input[type="checkbox"]');
  const confirmBtn = modal.querySelector('.btn-confirm');

  checkboxes.forEach(cb => {
    cb.addEventListener('change', () => {
      const allChecked = Array.from(checkboxes).every(c => c.checked);
      confirmBtn.disabled = !allChecked;
      const checked = Array.from(checkboxes).filter(c => c.checked).map(c => c.nextSibling.textContent).join(', ');
      log(`   ☑ 勾选变化 → 已选：${checked || '无'}`);
    });
  });

  // 取消
  modal.querySelector('.btn-cancel').addEventListener('click', () => {
    log('用户点击【取消】');
    destroyModalDOM(overlay, '取消');
  });

  // 确定
  confirmBtn.addEventListener('click', () => {
    if (confirmBtn.disabled) return;
    const selected = Array.from(checkboxes).filter(c => c.checked).map(c => c.nextSibling.textContent).join(', ');
    log(`用户点击【确定】→ 已选：${selected}`, 'info');
    destroyModalDOM(overlay, '确认');
  });
}

// ===== 打开弹窗 =====
document.getElementById('openBtn').addEventListener('click', () => {
  // 防止重复打开
  if (document.querySelector('.modal-overlay')) {
    log('弹窗已打开，请勿重复点击', 'err');
    return;
  }
  log('========== 点击「打开弹窗」 ==========');
  const { overlay, modal } = createModalDOM();

  // 自动模式：监听弹窗出现后自动全选 + 自动确认
  if (autoMode) {
    autoFillAndConfirm(modal);
  }
});

// ===== 自动模式逻辑 =====
function autoFillAndConfirm(modal) {
  log('🤖 自动模式：监听弹窗出现...', 'info');

  const tryAuto = () => {
    const checkboxes = modal.querySelectorAll('input[type="checkbox"]');
    if (!checkboxes.length) return;

    // 1. 自动全选
    checkboxes.forEach(cb => {
      if (!cb.checked) {
        cb.checked = true;
        cb.dispatchEvent(new Event('change', { bubbles: true }));
      }
    });
    log(`🤖 自动勾选了 ${checkboxes.length} 个选项`, 'info');

    // 2. 自动点击确定
    setTimeout(() => {
      const confirmBtn = modal.querySelector('.btn-confirm');
      if (confirmBtn && !confirmBtn.disabled) {
        log('🤖 自动点击【确定】按钮', 'info');
        confirmBtn.click(); // click 内部会触发 destroyModalDOM
      }
    }, 300);
  };

  // 用 MutationObserver 监听弹窗挂载到 DOM
  const observer = new MutationObserver(() => {
    if (modal.isConnected) {
      observer.disconnect();
      setTimeout(tryAuto, 100);
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });
  setTimeout(() => observer.disconnect(), 3000); // 兜底超时
}

// ===== 清空日志 =====
document.getElementById('clearLog').addEventListener('click', () => {
  logEl.innerHTML = '';
  log('日志已清空');
});

log('页面已加载。请点击「打开弹窗」开始测试。', 'info');
</script>
</body>
</html>
